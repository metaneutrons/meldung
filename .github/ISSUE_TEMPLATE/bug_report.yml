name: Bug report
description: Something behaves differently than documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not report security vulnerabilities here. Use
        [private vulnerability reporting](https://github.com/metaneutrons/meldung/security/advisories/new)
        instead.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you expect, and what did you get instead?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the form in ...
        2. Fill in ...
        3. Submit
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: Release tag, image tag or commit
    validations:
      required: true

  - type: dropdown
    id: deployment
    attributes:
      label: Deployment
      options:
        - Docker / docker compose
        - Vercel
        - Local development
        - Other
    validations:
      required: true

  - type: textarea
    id: config
    attributes:
      label: Relevant configuration
      description: >
        Which delivery channels, persistence driver, auth and locale were
        active. Remove every secret before pasting.
      render: yaml

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Server output around the failure, secrets removed.
      render: shell
