# The grouping is separated by update kind on purpose. One group across all
# kinds bundles breaking changes with harmless bumps, and a single broken
# dependency then blocks the whole stack. Minor and patch stay bundled, major
# stays ungrouped so every case arrives on its own.
#
# `cooldown` keeps a version that is withdrawn shortly after publication out of
# every pull request. Times are UTC.

version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '05:15'
    open-pull-requests-limit: 5
    cooldown:
      default-days: 3
      # semver-major-days is not permitted for github-actions. If it stands
      # here, Dependabot rejects the ENTIRE file and not a single update runs
      # any more, not even a security update.
    groups:
      github-actions-minor-patch:
        patterns: ['*']
        update-types: [minor, patch]

  # The base image in the Dockerfile, pinned by digest. Dependabot moves the
  # digest when the tag gets a rebuilt image (security fixes in Debian or
  # Node) and would also propose new tags; major versions of Node stay out,
  # they move deliberately together with engines and @types/node.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '05:45'
    open-pull-requests-limit: 2
    cooldown:
      default-days: 3
      # semver-major-days is not permitted for docker either; see above.
    ignore:
      # For an image on another registry the name is the repository path
      # without the host: public.ecr.aws/docker/library/node.
      - dependency-name: docker/library/node
        update-types: ['version-update:semver-major']

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '05:30'
    open-pull-requests-limit: 5
    cooldown:
      default-days: 3
      semver-major-days: 7
    groups:
      npm-minor-patch:
        patterns: ['*']
        update-types: [minor, patch]
    ignore:
      # Peer bounds belong here, otherwise Dependabot reliably produces a pull
      # request that npm cannot install at all.
      #
      # 2026-09-06: @typescript-eslint/parser 8.59.2, pulled in through
      # eslint-config-next, declares `typescript: >=4.8.4 <6.1.0`. Measured in
      # the installed tree, not taken from the release notes. Lift this entry
      # only once that bound widens.
      - dependency-name: typescript
        versions: ['>=6.1']
      # The types describe the Node.js API the code may use. They follow the
      # runtime the image ships (Node 24, see Dockerfile and engines), not the
      # newest Node: types for a later major would let code call APIs that do
      # not exist at runtime. Raise together with the base image.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
