name: Release

# No tag trigger on purpose. release-please creates the tag and starts this
# workflow through `gh workflow run release.yml --ref "$TAG"`. With a tag
# trigger as well, every tag would run two pipelines in parallel, which is
# exactly what happened for v0.2.0 and v0.2.1.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build, for example v1.2.3'
        required: false
        type: string

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  # ---------------------------------------------------------------- stage 1
  metadata:
    name: Establish identity
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.id.outputs.tag }}
      version: ${{ steps.id.outputs.version }}
      is_prerelease: ${{ steps.id.outputs.is_prerelease }}
      source_date_epoch: ${{ steps.id.outputs.source_date_epoch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - id: id
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          tag="${INPUT_TAG:-$GITHUB_REF_NAME}"

          # Canonical SemVer with a leading v, optional prerelease suffix.
          if ! printf '%s' "$tag" | grep -Eq '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::tag '$tag' is not canonical SemVer with a leading v"
            exit 1
          fi

          # The tag must point at the commit this run was started from.
          # Otherwise the pipeline would build something other than the tag.
          tag_commit=$(git rev-parse "refs/tags/${tag}^{}")
          if [ "$tag_commit" != "$GITHUB_SHA" ]; then
            echo "::error::tag $tag points at $tag_commit, the run is on $GITHUB_SHA"
            exit 1
          fi

          # The release core, without the prerelease suffix. A suffix is by
          # definition not in package.json or the release-please manifest.
          version="${tag#v}"
          version="${version%%-*}"

          pkg=$(jq -r .version package.json)
          man=$(jq -r '."."' .release-please-manifest.json)
          if [ "$pkg" != "$version" ] || [ "$man" != "$version" ]; then
            echo "::error::version mismatch: tag core $version, package.json $pkg, manifest $man"
            exit 1
          fi

          case "$tag" in
            *-*) is_prerelease=true ;;
            *)   is_prerelease=false ;;
          esac

          {
            echo "tag=$tag"
            echo "version=$version"
            echo "is_prerelease=$is_prerelease"
            echo "source_date_epoch=$(git log -1 --format=%ct "$tag_commit")"
          } >> "$GITHUB_OUTPUT"

          echo "tag=$tag core=$version prerelease=$is_prerelease"

  # ---------------------------------------------------------------- stage 2
  build:
    name: Build the image
    needs: [metadata]
    runs-on: ubuntu-24.04
    outputs:
      sbom: ${{ steps.names.outputs.sbom }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.metadata.outputs.tag }}
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - id: names
        run: echo "sbom=meldung-${{ needs.metadata.outputs.version }}.spdx.json" >> "$GITHUB_OUTPUT"

      # Built, not pushed. The push is a public mutation and belongs after the
      # preflight, so the bytes that get tested here are the bytes published
      # later, rather than a rebuild that merely used the same inputs.
      - name: Build linux/amd64 and linux/arm64 into an OCI archive
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          outputs: type=oci,dest=image.tar
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false
        env:
          SOURCE_DATE_EPOCH: ${{ needs.metadata.outputs.source_date_epoch }}

      # A build that produces an archive nobody starts is not a qualified
      # artefact. Load the host architecture out of the archive and run it.
      - name: Smoke-test the built image
        run: |
          set -euo pipefail
          docker buildx build --load --platform linux/amd64 -t meldung:smoke .
          docker run -d --name smoke -p 3000:3000 \
            -e CAPTCHA_SECRET=release-smoke-test-not-a-real-secret meldung:smoke
          for i in $(seq 1 40); do
            if curl -fsS -m 2 http://127.0.0.1:3000/api/health >/dev/null 2>&1; then
              echo "healthy after ${i}s"
              curl -fsS http://127.0.0.1:3000/api/health; echo
              curl -fsS -o /dev/null -w 'de: %{http_code}\n' http://127.0.0.1:3000/de
              curl -fsS -o /dev/null -w 'uk: %{http_code}\n' http://127.0.0.1:3000/uk
              exit 0
            fi
            sleep 1
          done
          echo "::error::the built image never became healthy"
          docker logs smoke
          exit 1

      - name: Generate the SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: meldung:smoke
          format: spdx-json
          output-file: ${{ steps.names.outputs.sbom }}
          upload-artifact: false
          upload-release-assets: false

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image
          path: image.tar
          retention-days: 1
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: ${{ steps.names.outputs.sbom }}
          if-no-files-found: error

  # ---------------------------------------------------------------- stage 4
  candidate:
    name: Assemble the release candidate
    needs: [metadata, build]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sbom
      - name: Check the inventory and write SHA256SUMS
        env:
          SBOM: ${{ needs.build.outputs.sbom }}
        run: |
          set -euo pipefail
          # The expected set is derived from the payload list rather than
          # written out twice: one SBOM plus the checksum file over it.
          expected=("$SBOM")

          for f in "${expected[@]}"; do
            [ -s "$f" ] || { echo "::error::missing or empty release asset: $f"; exit 1; }
          done

          actual=$(find . -maxdepth 1 -type f ! -name 'SHA256SUMS' -printf '%f\n' | sort)
          want=$(printf '%s\n' "${expected[@]}" | sort)
          if [ "$actual" != "$want" ]; then
            echo "::error::asset inventory mismatch"
            printf 'expected:\n%s\nactual:\n%s\n' "$want" "$actual"
            exit 1
          fi

          # A structurally broken or empty SBOM would otherwise pass the count
          # check unnoticed.
          jq -e '(.name // "") != "" and ((.packages // []) | length) > 0' "$SBOM" > /dev/null \
            || { echo "::error::the SBOM names nothing or lists no packages"; exit 1; }

          sha256sum "${expected[@]}" > SHA256SUMS
          cat SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets
          path: |
            *.spdx.json
            SHA256SUMS
          if-no-files-found: error

  # ---------------------------------------------------------------- stage 6
  # Runs for a prerelease as well, deliberately deviating from the template.
  # There the channels are Homebrew and AUR, which a prerelease never touches.
  # Here the one channel is the container registry, and a prerelease does push
  # to it, so its capability has to be checked beforehand just the same.
  preflight:
    name: Registry preflight
    needs: [metadata]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Verify write access to the registry without writing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Ask the registry for a token that actually carries push scope. This
          # publishes nothing and fails loudly if the permission is missing.
          token=$(curl -fsS -u "${{ github.actor }}:${GH_TOKEN}" \
            "https://ghcr.io/token?service=ghcr.io&scope=repository:${{ github.repository }}:pull,push" \
            | jq -r '.token // empty')
          [ -n "$token" ] || { echo "::error::ghcr.io issued no token"; exit 1; }

          granted=$(printf '%s' "$token" | cut -d. -f2 \
            | tr '_-' '/+' | awk '{ while (length($0)%4) $0=$0"="; print }' \
            | base64 -d 2>/dev/null | jq -r '[.access[]?.actions[]?] | join(",")')
          echo "granted scopes: ${granted:-none}"
          case ",$granted," in
            *,push,*) echo "push scope confirmed" ;;
            *) echo "::error::the registry token carries no push scope: ${granted:-none}"; exit 1 ;;
          esac

  # ---------------------------------------------------------------- stage 7
  stage:
    name: Stage the prerelease
    needs: [metadata, build, candidate, preflight]
    if: >-
      !cancelled()
      && needs.metadata.result == 'success'
      && needs.build.result == 'success'
      && needs.candidate.result == 'success'
      && needs.preflight.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets
          path: candidate
      - name: Attach the assets and publish as a prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.metadata.outputs.tag }}
        run: |
          set -euo pipefail
          state=$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null || echo absent)
          case "$state" in
            absent) gh release create "$TAG" --draft --verify-tag --title "$TAG" --generate-notes ;;
            true)   echo "draft from release-please, attaching assets" ;;
            false)  echo "::error::release $TAG is already published"; exit 1 ;;
          esac

          gh release upload "$TAG" candidate/* --clobber

          # Read the bytes back from the release rather than trusting the upload.
          mkdir readback && cd readback
          gh release download "$TAG" --pattern '*'
          sha256sum -c SHA256SUMS
          cmp SHA256SUMS ../candidate/SHA256SUMS
          cd ..

          gh release edit "$TAG" --draft=false --prerelease

  # ---------------------------------------------------------------- stage 8
  publish:
    name: Publish to the registry
    needs: [metadata, build, candidate, preflight, stage]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: image
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - id: push
        name: Push the built archive, unchanged
        env:
          TAG: ${{ needs.metadata.outputs.tag }}
          VERSION: ${{ needs.metadata.outputs.version }}
          IS_PRERELEASE: ${{ needs.metadata.outputs.is_prerelease }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq skopeo

          # A prerelease gets its exact tag only. A stable release also gets
          # the minor and major aliases. `latest` is set in promote, never here.
          tags="$TAG"
          if [ "$IS_PRERELEASE" = 'false' ]; then
            tags="$tags $VERSION ${VERSION%.*} ${VERSION%%.*}"
          fi

          for t in $tags; do
            echo "pushing $IMAGE:$t"
            skopeo copy --all "oci-archive:image.tar" "docker://${IMAGE}:${t}"
          done

          digest=$(skopeo inspect --raw "docker://${IMAGE}:${TAG}" | sha256sum | cut -d' ' -f1)
          echo "digest=sha256:$digest" >> "$GITHUB_OUTPUT"
          echo "published ${IMAGE}@sha256:$digest"

      - name: Sign the image with cosign
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      # Verification against the public source, not against the local state.
      - name: Verify what the registry actually serves
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          TAG: ${{ needs.metadata.outputs.tag }}
        run: |
          set -euo pipefail
          remote=$(skopeo inspect --raw "docker://${IMAGE}:${TAG}" | sha256sum | cut -d' ' -f1)
          [ "sha256:$remote" = "$DIGEST" ] || {
            echo "::error::the registry serves sha256:$remote, expected $DIGEST"; exit 1; }

          # Both declared platforms have to be in the published manifest list.
          for p in amd64 arm64; do
            skopeo inspect --raw "docker://${IMAGE}@${DIGEST}" \
              | jq -e --arg a "$p" '[.manifests[]?.platform.architecture] | index($a)' > /dev/null \
              || { echo "::error::the published manifest has no $p"; exit 1; }
          done

          cosign verify "${IMAGE}@${DIGEST}" \
            --certificate-identity-regexp "^https://github.com/${GITHUB_REPOSITORY}/" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com > /dev/null
          echo "signature and both platforms verified against the registry"

  # ---------------------------------------------------------------- stage 9
  promote:
    name: Promote to latest
    needs: [metadata, publish]
    if: needs.metadata.outputs.is_prerelease == 'false' && needs.publish.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
    steps:
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Move latest and take the release out of prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.metadata.outputs.tag }}
          DIGEST: ${{ needs.publish.outputs.digest }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq skopeo
          skopeo copy --all "docker://${IMAGE}@${DIGEST}" "docker://${IMAGE}:latest"

          served=$(skopeo inspect --raw "docker://${IMAGE}:latest" | sha256sum | cut -d' ' -f1)
          [ "sha256:$served" = "$DIGEST" ] || {
            echo "::error::latest serves sha256:$served, expected $DIGEST"; exit 1; }

          gh release edit "$TAG" --prerelease=false --latest
          echo "promoted ${IMAGE}:latest and release $TAG"
