name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    # The app key and its client id live in the protected environment, so the
    # job has to declare it: without this it sees neither.
    environment: release
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      # The release pull request must be created by an app, not by
      # GITHUB_TOKEN: GitHub suppresses workflow triggers from GITHUB_TOKEN
      # pushes, so CI would never run on the release pull request and the
      # required check would stay pending forever. No fallback for the same
      # reason, and no continue-on-error, which would hide exactly that.
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          client-id: ${{ vars.RELEASE_PLEASE_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: rp
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # The tag created here is the only automatic trigger of the release
      # pipeline. The pipeline itself carries no tag trigger, otherwise every
      # tag would start two runs in parallel.
      - name: Start the release pipeline
        if: steps.rp.outputs.release_created == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TAG: ${{ steps.rp.outputs.tag_name }}
        run: gh workflow run release.yml --ref "$TAG" -f tag="$TAG" --repo "$GITHUB_REPOSITORY"
